name: Product child CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-lint-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native GStreamer development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install lint tool
        run: python -m pip install --disable-pip-version-check ruff==0.16.2
      - name: Lint and Python tests
        run: |
          ruff check .
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Build native core and run unit tests
        run: |
          cmake -S native -B native/build-ci -DGAR_RX_BUILD_APP=ON -DBUILD_TESTING=ON
          cmake --build native/build-ci --parallel
          test -x native/build-ci/gar-stream-rx
          ctest --test-dir native/build-ci --output-on-failure
